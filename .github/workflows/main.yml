name: ARISTA MATRIX PIPELINE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: arista-matrix
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: 1

jobs:

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: output
          key: arista-output-${{ github.run_id }}
          restore-keys: |
            arista-output-
            arista-output

      - name: Prepare Bank
        run: |
          mkdir -p output
          python downloader.py
          python cleaner.py

      - name: Save Cache
        uses: actions/cache/save@v4
        with:
          path: output
          key: arista-output-${{ github.run_id }}

  tcp:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: output
          key: arista-output-${{ github.run_id }}
          restore-keys: |
            arista-output-
            arista-output

      - name: TCP Scan
        run: |
          python main.py --tcp

      - name: Save Cache
        uses: actions/cache/save@v4
        with:
          path: output
          key: arista-output-${{ github.run_id }}

  tls:
    needs: tcp
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: output
          key: arista-output-${{ github.run_id }}
          restore-keys: |
            arista-output-
            arista-output

      - name: TLS Scan
        run: |
          python main.py --tls

      - name: Save Cache
        uses: actions/cache/save@v4
        with:
          path: output
          key: arista-output-${{ github.run_id }}

  https:
    needs: tls
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: output
          key: arista-output-${{ github.run_id }}
          restore-keys: |
            arista-output-
            arista-output

      - name: HTTPS Validation
        run: |
          python main.py --https

      - name: Save Cache
        uses: actions/cache/save@v4
        with:
          path: output
          key: arista-output-${{ github.run_id }}

  fingerprint:
    needs: https
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: output
          key: arista-output-${{ github.run_id }}
          restore-keys: |
            arista-output-
            arista-output

      - name: Fingerprint
        run: |
          python main.py --fp

      - name: Save Cache
        uses: actions/cache/save@v4
        with:
          path: output
          key: arista-output-${{ github.run_id }}

  geo:
    needs: fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: output
          key: arista-output-${{ github.run_id }}
          restore-keys: |
            arista-output-
            arista-output

      - name: GEO
        run: |
          python main.py --geo

      - name: Save Cache
        uses: actions/cache/save@v4
        with:
          path: output
          key: arista-output-${{ github.run_id }}

  finalize:
    needs: geo
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: output
          key: arista-output-${{ github.run_id }}
          restore-keys: |
            arista-output-
            arista-output

      - name: Finalize
        run: |
          python main.py --finalize

      - name: Save Final Cache
        uses: actions/cache/save@v4
        with:
          path: output
          key: arista-output-${{ github.run_id }}

      - name: Commit Final Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p output

          [ -f output/best_ips.txt ] && git add output/best_ips.txt
          [ -f output/domains.txt ] && git add output/domains.txt
          [ -f output/results.txt ] && git add output/results.txt
          [ -f output/scan_cursor.txt ] && git add output/scan_cursor.txt
          [ -f output/current_part.txt ] && git add output/current_part.txt

          [ -f output/tcp_live.txt ] && git add output/tcp_live.txt
          [ -f output/tls_live.txt ] && git add output/tls_live.txt
          [ -f output/https_live.txt ] && git add output/https_live.txt
          [ -f output/fingerprint_results.txt ] && git add output/fingerprint_results.txt
          [ -f output/scanned_cache.txt ] && git add output/scanned_cache.txt
          [ -f output/geo_cache.json ] && git add output/geo_cache.json
          [ -f output/live_bank.txt ] && git add output/live_bank.txt

          git diff --cached --quiet || (
            git commit -m "ARISTA $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          )
