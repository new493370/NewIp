name: ARISTA MATRIX PIPELINE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: arista-matrix
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: 1

jobs:

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore live_bank from Cache
        uses: actions/cache@v3
        with:
          path: output/live_bank.txt
          key: live-bank-${{ github.run_id }}
          restore-keys: |
            live-bank-

      - name: Prepare Bank
        run: |
          mkdir -p output
          python downloader.py
          python cleaner.py

      - name: Cache clean_ips for TCP
        uses: actions/cache@v3
        with:
          path: output/clean_ips.txt
          key: clean-ips-${{ github.run_id }}
          restore-keys: |
            clean-ips-

      - name: Save live_bank to Cache
        uses: actions/cache@v3
        with:
          path: output/live_bank.txt
          key: live-bank-${{ github.run_id }}

      - name: Cleanup heavy files
        run: |
          rm -f output/ip_bank.txt
          rm -f output/*.tmp

  tcp:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore live_bank from Cache
        uses: actions/cache@v3
        with:
          path: output/live_bank.txt
          key: live-bank-${{ github.run_id }}
          restore-keys: |
            live-bank-

      - name: Restore clean_ips from Cache
        uses: actions/cache@v3
        with:
          path: output/clean_ips.txt
          key: clean-ips-${{ github.run_id }}
          restore-keys: |
            clean-ips-

      - name: TCP Scan
        run: |
          mkdir -p output
          python main.py --tcp

      - name: Cache TCP results
        uses: actions/cache@v3
        with:
          path: output/tcp_live.txt
          key: tcp-live-${{ github.run_id }}
          restore-keys: |
            tcp-live-

      - name: Save live_bank to Cache
        uses: actions/cache@v3
        with:
          path: output/live_bank.txt
          key: live-bank-${{ github.run_id }}

      - name: Cleanup temporary files
        run: |
          rm -f output/clean_ips.txt
          rm -f output/current_part.txt
          rm -f output/scanned_cache.txt
          rm -f output/*.tmp

  tls:
    needs: tcp
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore live_bank from Cache
        uses: actions/cache@v3
        with:
          path: output/live_bank.txt
          key: live-bank-${{ github.run_id }}
          restore-keys: |
            live-bank-

      - name: Restore TCP results from Cache
        uses: actions/cache@v3
        with:
          path: output/tcp_live.txt
          key: tcp-live-${{ github.run_id }}
          restore-keys: |
            tcp-live-

      - name: TLS Scan
        run: |
          mkdir -p output
          python main.py --tls

      - name: Cache TLS results
        uses: actions/cache@v3
        with:
          path: output/tls_live.txt
          key: tls-live-${{ github.run_id }}
          restore-keys: |
            tls-live-

      - name: Save live_bank to Cache
        uses: actions/cache@v3
        with:
          path: output/live_bank.txt
          key: live-bank-${{ github.run_id }}

      - name: Cleanup temporary files
        run: |
          rm -f output/tcp_live.txt
          rm -f output/current_part.txt
          rm -f output/*.tmp

  https:
    needs: tls
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore live_bank from Cache
        uses: actions/cache@v3
        with:
          path: output/live_bank.txt
          key: live-bank-${{ github.run_id }}
          restore-keys: |
            live-bank-

      - name: Restore TLS results from Cache
        uses: actions/cache@v3
        with:
          path: output/tls_live.txt
          key: tls-live-${{ github.run_id }}
          restore-keys: |
            tls-live-

      - name: HTTPS Validation
        run: |
          mkdir -p output
          python main.py --https

      - name: Cache HTTPS results
        uses: actions/cache@v3
        with:
          path: output/https_live.txt
          key: https-live-${{ github.run_id }}
          restore-keys: |
            https-live-

      - name: Save live_bank to Cache
        uses: actions/cache@v3
        with:
          path: output/live_bank.txt
          key: live-bank-${{ github.run_id }}

      - name: Cleanup temporary files
        run: |
          rm -f output/tls_live.txt
          rm -f output/current_part.txt
          rm -f output/*.tmp

  fingerprint:
    needs: https
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore live_bank from Cache
        uses: actions/cache@v3
        with:
          path: output/live_bank.txt
          key: live-bank-${{ github.run_id }}
          restore-keys: |
            live-bank-

      - name: Restore HTTPS results from Cache
        uses: actions/cache@v3
        with:
          path: output/https_live.txt
          key: https-live-${{ github.run_id }}
          restore-keys: |
            https-live-

      - name: Fingerprint
        run: |
          mkdir -p output
          python main.py --fp

      - name: Cache Fingerprint results
        uses: actions/cache@v3
        with:
          path: output/fingerprint_results.txt
          key: fp-results-${{ github.run_id }}
          restore-keys: |
            fp-results-

      - name: Save live_bank to Cache
        uses: actions/cache@v3
        with:
          path: output/live_bank.txt
          key: live-bank-${{ github.run_id }}

      - name: Cleanup temporary files
        run: |
          rm -f output/https_live.txt
          rm -f output/current_part.txt
          rm -f output/*.tmp

  geo:
    needs: fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore live_bank from Cache
        uses: actions/cache@v3
        with:
          path: output/live_bank.txt
          key: live-bank-${{ github.run_id }}
          restore-keys: |
            live-bank-

      - name: Restore Fingerprint results from Cache
        uses: actions/cache@v3
        with:
          path: output/fingerprint_results.txt
          key: fp-results-${{ github.run_id }}
          restore-keys: |
            fp-results-

      - name: GEO
        run: |
          mkdir -p output
          python main.py --geo

      - name: Cache GEO results
        uses: actions/cache@v3
        with:
          path: output/results.txt
          key: results-${{ github.run_id }}
          restore-keys: |
            results-

      - name: Save live_bank to Cache
        uses: actions/cache@v3
        with:
          path: output/live_bank.txt
          key: live-bank-${{ github.run_id }}

      - name: Cleanup temporary files
        run: |
          rm -f output/fingerprint_results.txt
          rm -f output/current_part.txt
          rm -f output/*.tmp

  finalize:
    needs: geo
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore live_bank from Cache
        uses: actions/cache@v3
        with:
          path: output/live_bank.txt
          key: live-bank-${{ github.run_id }}
          restore-keys: |
            live-bank-

      - name: Restore results from Cache
        uses: actions/cache@v3
        with:
          path: output/results.txt
          key: results-${{ github.run_id }}
          restore-keys: |
            results-

      - name: Restore GEO cache
        uses: actions/cache@v3
        with:
          path: output/geo_cache.json
          key: geo-cache-${{ github.run_id }}
          restore-keys: |
            geo-cache-

      - name: Finalize
        run: |
          mkdir -p output
          python main.py --finalize

      - name: Save live_bank to Cache
        uses: actions/cache@v3
        with:
          path: output/live_bank.txt
          key: live-bank-${{ github.run_id }}

      - name: Commit Final Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p output

          [ -f output/best_ips.txt ] && git add output/best_ips.txt
          [ -f output/domains.txt ] && git add output/domains.txt
          [ -f output/results.txt ] && git add output/results.txt
          [ -f output/geo_cache.json ] && git add output/geo_cache.json
          [ -f output/https_meta.json ] && git add output/https_meta.json
          [ -f output/scan_cursor.txt ] && git add output/scan_cursor.txt

          if ! git diff --cached --quiet; then
            git commit -m "ARISTA $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            for i in 1 2 3
            do
              git fetch origin main
              if git rebase origin/main; then
                git push origin HEAD:main && exit 0
              fi
              git rebase --abort || true
              sleep 10
            done
            exit 1
          fi

      - name: Cleanup all caches and files
        run: |
          rm -f output/ip_bank.txt
          rm -f output/clean_ips.txt
          rm -f output/current_part.txt
          rm -f output/tcp_live.txt
          rm -f output/tls_live.txt
          rm -f output/https_live.txt
          rm -f output/fingerprint_results.txt
          rm -f output/scanned_cache.txt
          rm -f output/*.tmp
